<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joyly Motion System · M2 Playground</title>
    <meta
      name="description"
      content="Visual playground for stacking Joyly Motion System primitives, saving motion packs, and testing them across scenes."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23081a28'/%3E%3Cpath d='M16 42c8-18 24-18 32 0' fill='none' stroke='%237de2ff' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='26' r='5' fill='%23ffa86b'/%3E%3Ccircle cx='40' cy='26' r='5' fill='%238dffce'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./web/styles.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script type="module" src="./web/app.js"></script>
  </head>
  <body data-scene="aurora">
    <main class="shell playground-shell">
      <section class="hero">
        <div class="hero-stage card">
          <div class="hero-stage__topline">
            <span>Joyly Motion System · M2 Playground</span>
            <span id="stack-count">0 lanes / 0 blocks</span>
          </div>

          <div class="playground-stage" id="playground-stage">
            <div class="playground-stage__scene" id="playground-stage-scene">
              <div class="playground-orbit" aria-hidden="true">
                <span class="ghost-token" id="ghost-1">A</span>
                <span class="ghost-token" id="ghost-2">B</span>
                <span class="ghost-token" id="ghost-3">C</span>
              </div>
              <img
                id="hero-asset"
                class="hero-asset"
                src="../assets/avatars/characters/Charac-1-wave.png"
                alt="Joyly avatar sample"
              />
            </div>
          </div>

          <div class="button-row">
            <button id="btn-preview" type="button">Preview lanes</button>
            <button id="btn-reset" type="button">Reset</button>
            <button id="btn-demo" type="button">Load demo motion pack</button>
            <button id="btn-popout-preview" type="button">Open preview window</button>
          </div>
          <div class="preview-stage-controls">
            <label class="field preview-stage-controls__field">
              <span>Stage zoom</span>
              <input id="stage-zoom" type="range" min="0.25" max="1.5" step="0.05" value="0.75" />
            </label>
            <span id="stage-zoom-value" class="mini-chip">75%</span>
          </div>
          <div class="status-row compact-status">
            <span id="runtime-status" class="plain-status">Runtime: ready</span>
            <span id="scene-status" class="plain-status">Scene: aurora</span>
            <span id="motion-pack-status" class="plain-status">Motion packs: 0 saved</span>
          </div>
          <div class="scene-bank scene-bank--hero">
            <button class="scene-chip is-active" data-scene="aurora" type="button">Aurora</button>
            <button class="scene-chip" data-scene="midnight" type="button">Midnight</button>
            <button class="scene-chip" data-scene="sunset" type="button">Sunset</button>
          </div>
        </div>
      </section>

      <div class="section-resizer" data-resize="hero" aria-hidden="true"></div>

      <section class="panel-grid" id="panel-grid">
        <article class="card panel panel--primitives">
          <div class="lab-head">
            <div>
              <p class="lab-kicker">Block browser</p>
            </div>
            <span class="mini-chip">click to add</span>
          </div>
          <div id="primitive-list" class="primitive-list"></div>
        </article>

        <div class="grid-resizer grid-resizer--left" data-resize="left" aria-hidden="true"></div>

        <article class="card panel panel--stack">
          <div class="lab-head">
            <div>
              <p class="lab-kicker">Lane editor</p>
            </div>
            <span class="mini-chip">lanes + params</span>
          </div>

          <div class="stack-toolbar">
            <label class="field">
              <span>Motion pack name</span>
              <input id="motion-pack-name" type="text" value="Aurora lift" />
            </label>
            <label class="field">
              <span>Scene</span>
              <select id="scene-select">
                <option value="aurora">Aurora</option>
                <option value="midnight">Midnight</option>
                <option value="sunset">Sunset</option>
              </select>
            </label>
          </div>

          <div class="stack-toolbar stack-toolbar--dense">
            <div class="button-row compact-buttons">
              <button id="btn-add-lane" type="button">New lane</button>
              <button id="btn-clear" type="button">Clear lanes</button>
              <button id="btn-toggle-preview-card" type="button">Hide preview card</button>
            </div>
            <div class="timeline-zoom">
              <button id="btn-zoom-out" type="button" aria-label="Zoom out timeline">-</button>
              <input id="timeline-zoom" type="range" min="0.5" max="6" step="0.25" value="1.25" />
              <button id="btn-zoom-in" type="button" aria-label="Zoom in timeline">+</button>
              <label class="timeline-length-field">
                <span>Length</span>
                <input id="timeline-length-input" type="number" min="1" step="0.5" value="8" />
              </label>
              <span id="timeline-length" class="mini-chip">Shown: 0.00s</span>
            </div>
          </div>

          <div id="stack-list" class="stack-list" aria-label="motion lanes"></div>

          <div id="step-popover" class="stack-popover is-hidden" aria-live="polite">
            <div class="stack-popover__head">
              <div>
                <p class="lab-kicker">Selected block</p>
                <h3 id="step-title">Nothing selected</h3>
              </div>
              <div class="stack-popover__meta">
                <span id="step-kind" class="mini-chip">--</span>
                <button id="step-close" type="button" class="stack-popover__close" aria-label="Close block editor">x</button>
              </div>
            </div>
            <div id="step-fields" class="step-fields"></div>
          </div>
        </article>

        <div class="grid-resizer grid-resizer--right" data-resize="right" aria-hidden="true"></div>

        <article class="card panel panel--motion-pack">
          <div class="lab-head">
            <div>
              <p class="lab-kicker">Motion pack bank</p>
            </div>
            <span class="mini-chip">local motion packs</span>
          </div>

          <div class="stack-toolbar">
            <label class="field file-field">
              <span>Import PNG</span>
              <input id="png-input" type="file" accept="image/png,image/jpeg,image/webp" />
            </label>
            <div class="button-row compact-buttons">
              <button id="btn-save" type="button">Save motion pack</button>
            </div>
          </div>

            <div class="stack-toolbar stack-toolbar--dense">
            <div class="button-row compact-buttons">
              <button id="btn-export" type="button">Export motion pack</button>
              <button id="btn-import" type="button">Import motion pack</button>
            </div>
            <input id="motion-pack-input" type="file" accept="application/json,.json" hidden />
          </div>

          <div id="motion-pack-list" class="motion-pack-list"></div>
        </article>
      </section>
    </main>
  </body>
</html>

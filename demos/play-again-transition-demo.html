<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Again 过场动画 Demo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0e0620; font-family: system-ui, sans-serif; }
    canvas { display: block; position: fixed; inset: 0; }

    #overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 100;
      background: #0e0620; transition: opacity 0.6s;
    }
    #overlay.fade-out { opacity: 0; pointer-events: none; }
    .ov-title { color: rgba(255,255,255,0.5); font-size: 13px; letter-spacing: 0.5px; margin-bottom: 12px; }
    .progress-bar { width: 200px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 1px; }
    .progress-fill { height: 100%; background: #FFC107; border-radius: 1px; width: 0%; transition: width 0.3s; }

    #postgame {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      background: linear-gradient(160deg, rgba(14,6,32,0.90) 0%, rgba(27,12,60,0.86) 100%);
      backdrop-filter: blur(14px);
    }
    .pg-eyebrow { color: #FFC107; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; }
    .pg-title { color: #fff; font-size: 34px; font-weight: 800; margin: 4px 0; }
    .pg-sub { color: rgba(255,255,255,0.35); font-size: 13px; }
    .pg-podium { display: flex; flex-direction: column; gap: 9px; width: 300px; }
    .pg-row {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.06); border-radius: 13px; padding: 11px 15px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .pg-row.first { background: rgba(255,193,7,0.12); border-color: rgba(255,193,7,0.28); }
    .pg-rank { font-size: 17px; width: 26px; text-align: center; }
    .pg-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; background: rgba(255,255,255,0.1); }
    .pg-name { flex: 1; color: #fff; font-size: 14px; font-weight: 600; }
    .pg-score { color: rgba(255,255,255,0.45); font-size: 12px; }
    .pg-row.first .pg-score { color: #FFC107; font-weight: 600; }

    #play-again-btn {
      background: linear-gradient(135deg, #E8392A, #F26522);
      border: none; border-radius: 50px; padding: 15px 44px;
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 8px 28px rgba(232,57,42,0.4);
    }
    #play-again-btn:hover { transform: scale(1.04); }
    #play-again-btn:active { transform: scale(0.97); }

    #cover {
      position: fixed; inset: 0; z-index: 30;
      background: #fff; opacity: 0; pointer-events: none;
      display: flex; align-items: center; justify-content: center;
    }
    #cover-msg { color: rgba(100,70,160,0.6); font-size: 15px; opacity: 0; transition: opacity 0.4s; }

    #setup {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 36px;
      background: linear-gradient(160deg, #f0ebff 0%, #fdf7e8 100%);
      opacity: 0; pointer-events: none; transition: opacity 1.4s ease-in-out;
    }
    .setup-eyebrow { color: #E8392A; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
    .setup-title { color: #1B3D8F; font-size: 30px; font-weight: 800; }
    .setup-sub { color: rgba(27,61,143,0.45); font-size: 13px; margin-top: 6px; }
    .setup-question h3 { color: #1B3D8F; font-size: 14px; font-weight: 600; margin-bottom: 14px; text-align: center; }
    .setup-options { display: flex; gap: 11px; }
    .setup-opt {
      width: 68px; height: 68px; border-radius: 17px;
      border: 2px solid rgba(27,61,143,0.15); background: #fff; color: #1B3D8F;
      font-size: 19px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; box-shadow: 0 2px 10px rgba(27,61,143,0.07);
    }
    .setup-opt:hover { border-color: #1B3D8F; transform: scale(1.06); }
    .setup-opt.selected { background: #1B3D8F; color: #FFC107; border-color: #1B3D8F; }
    #start-btn {
      background: linear-gradient(135deg, #1B3D8F, #2b5ec4);
      border: none; border-radius: 50px; padding: 14px 44px;
      color: #FFC107; font-size: 16px; font-weight: 700; cursor: pointer;
      transition: transform 0.15s; box-shadow: 0 8px 24px rgba(27,61,143,0.35);
    }
    #start-btn:hover { transform: scale(1.04); }

    .demo-hint {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.18); font-size: 10px; letter-spacing: 1.5px;
      text-transform: uppercase; z-index: 5; pointer-events: none; transition: opacity 0.4s;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="overlay">
  <div class="ov-title" id="overlay-title">正在加载…</div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
</div>

<div id="postgame">
  <div style="text-align:center">
    <div class="pg-eyebrow">游戏结束</div>
    <div class="pg-title">精彩对决！</div>
    <div class="pg-sub">共 10 题 · 平均正确率 68%</div>
  </div>
  <div class="pg-podium">
    <div class="pg-row first">
      <span class="pg-rank">🥇</span><div class="pg-avatar">😎</div>
      <span class="pg-name">小明</span><span class="pg-score">2400 pts</span>
    </div>
    <div class="pg-row">
      <span class="pg-rank">🥈</span><div class="pg-avatar">🐼</div>
      <span class="pg-name">熊猫宝</span><span class="pg-score">1980 pts</span>
    </div>
    <div class="pg-row">
      <span class="pg-rank">🥉</span><div class="pg-avatar">🌸</div>
      <span class="pg-name">花花</span><span class="pg-score">1650 pts</span>
    </div>
  </div>
  <button id="play-again-btn">再来一局 →</button>
</div>

<div id="cover"><div id="cover-msg">正在准备新游戏…</div></div>

<div id="setup">
  <div style="text-align:center">
    <div class="setup-eyebrow">新的一局</div>
    <div class="setup-title">宇宙智力大挑战</div>
    <div class="setup-sub">选择题目数量开始游戏</div>
  </div>
  <div class="setup-question">
    <h3>题目数量</h3>
    <div class="setup-options">
      <button class="setup-opt" data-count="5">5</button>
      <button class="setup-opt selected" data-count="10">10</button>
      <button class="setup-opt" data-count="15">15</button>
    </div>
  </div>
  <button id="start-btn">开始游戏</button>
</div>

<div class="demo-hint" id="demo-hint">Demo · 再来一局过场</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ═══════════════════════════════════════════════════════════
//  过场时序常量（毫秒）
// ═══════════════════════════════════════════════════════════
const EMITTER_DURATION  = 5200;   // 发射器沿路径走完所需时间
const SPAWN_INTERVAL    = 150;    // 每次生成间隔（降低密度）
const FLOWERS_PER_SPAWN = 1;      // 每次生成数量
const LEAF_RATIO        = 0.30;   // 30% 概率生成叶子
const COVER_DELAY       = 4000;   // 点击后多久开始白屏
const COVER_IN_MS       = 1000;   // 白屏淡入时长
const REVEAL_DELAY      = 6800;   // 点击后多久揭幕 setup
const COVER_OUT_MS      = 1400;   // 白屏淡出时长

// ─── 色盘 ──────────────────────────────────────────────────
const PETAL_PAIRS = [
  { petal: 0xE8392A, stamen: 0xFFC107 },
  { petal: 0xF26522, stamen: 0xFFC107 },
  { petal: 0xFFC107, stamen: 0xE8392A },
  { petal: 0x1B3D8F, stamen: 0xF9C0C0 },
  { petal: 0xF9C0C0, stamen: 0x1B3D8F },
  { petal: 0xFFFFFF, stamen: 0xFFC107 },
  { petal: 0xF4A7A7, stamen: 0xFFC107 },
  { petal: 0xE8795E, stamen: 0x1B3D8F },
  { petal: 0xD95B43, stamen: 0x1B3D8F },
];
const LEAF_COLORS = [0x00A99D, 0x00877D, 0x4ECDC4, 0x2D6A4F, 0x52B788];
const ALL_COLORS  = [...PETAL_PAIRS.flatMap(p => [p.petal, p.stamen]), ...LEAF_COLORS];

// ═══════════════════════════════════════════════════════════
//  渲染器 + 场景（固定摄像机，不飞行）
// ═══════════════════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('canvas'), antialias: true,
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0620);

// 固定摄像机 — z=700, 看向原点
// 可视范围 @ z=0: ±~800 × ±~460 (16:9 screen)
const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.5, 3000);
camera.position.set(0, 0, 700);
camera.lookAt(0, 0, 0);

// ═══════════════════════════════════════════════════════════
//  发射器路径（对应截图中的黄线：左下 → 右上）
//  坐标系 @ z=0 平面: 屏幕左 ≈ -800, 右 ≈ +800, 上 ≈ +460, 下 ≈ -460
// ═══════════════════════════════════════════════════════════
const emitterPath = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-1100, -700, 0),   // 屏幕外左下起点
  new THREE.Vector3( -680, -490, 0),   // 进入左下角
  new THREE.Vector3( -280, -290, 0),   // 左下区域
  new THREE.Vector3(   50,  -60, 0),   // 画面中心
  new THREE.Vector3(  380,  170, 0),   // 中右偏上
  new THREE.Vector3(  700,  400, 0),   // 右上聚集区（红线区域）
  new THREE.Vector3( 1100,  680, 0),   // 屏幕外右上出口
], false, 'catmullrom', 0.5);

// ═══════════════════════════════════════════════════════════
//  工具函数
// ═══════════════════════════════════════════════════════════
function deepClone(src) {
  const clone = src.clone(true);
  clone.traverse(n => {
    if (n.isMesh && n.material) {
      n.material = Array.isArray(n.material)
        ? n.material.map(m => m.clone())
        : n.material.clone();
    }
  });
  return clone;
}

function convertToFlat(model) {
  model.traverse(n => {
    if (!n.isMesh) return;
    const src = Array.isArray(n.material) ? n.material : [n.material];
    const flat = src.map(m => new THREE.MeshBasicMaterial({
      color: m.color?.clone() ?? new THREE.Color(0xffffff),
      name: m.name, side: THREE.DoubleSide, transparent: true, opacity: 1,
    }));
    n.material = flat.length === 1 ? flat[0] : flat;
  });
}

function applyColor(obj, mode) {
  obj.traverse(n => {
    if (!n.isMesh) return;
    const mats = Array.isArray(n.material) ? n.material : [n.material];
    if (mode === 'leaf') {
      const hex = LEAF_COLORS[Math.floor(Math.random() * LEAF_COLORS.length)];
      mats.forEach(m => m.color.setHex(hex));
    } else if (mode === 'all') {
      const hex = ALL_COLORS[Math.floor(Math.random() * ALL_COLORS.length)];
      mats.forEach(m => m.color.setHex(hex));
    } else {
      const pair = PETAL_PAIRS[Math.floor(Math.random() * PETAL_PAIRS.length)];
      mats.forEach(m => {
        if (/petal/i.test(m.name))        m.color.setHex(pair.petal);
        else if (/stamen/i.test(m.name))  m.color.setHex(pair.stamen);
        else if (/leaf/i.test(m.name))    m.color.setHex(pair.stamen);
        else                               m.color.setHex(pair.petal);
      });
    }
  });
}

// ═══════════════════════════════════════════════════════════
//  背景散布（结果页显示时已存在的彩带 / 叶子）
//  数量少、尺寸小，模拟游戏 post-game 的彩带背景
// ═══════════════════════════════════════════════════════════
const bgObjects = [];

function spawnBackground(templates) {
  const hw = 850, hh = 480;
  for (let i = 0; i < 50; i++) {
    const isCf = Math.random() > 0.4;
    const tpl  = isCf ? templates.confetti : templates.leaf;
    if (!tpl) continue;
    const obj = deepClone(tpl);
    applyColor(obj, isCf ? 'all' : 'leaf');
    obj.position.set(
      (Math.random() - 0.5) * hw * 2.3,
      (Math.random() - 0.5) * hh * 2.3,
      (Math.random() - 0.5) * 150,
    );
    const s = 10 + Math.random() * 16;
    obj.scale.setScalar(0.1);
    obj.rotation.set(
      Math.random() * Math.PI * 2,
      Math.random() * Math.PI * 2,
      Math.random() * Math.PI * 2,
    );
    scene.add(obj);
    bgObjects.push(obj);
    // 弹出
    gsap.to(obj.scale, { x: s, y: s, z: s, duration: 0.6, delay: i * 0.03, ease: 'back.out(1.4)' });
    // 缓慢漂浮
    gsap.to(obj.position, {
      y: `+=${15 + Math.random() * 35}`,
      duration: 4 + Math.random() * 3,
      ease: 'sine.inOut', repeat: -1, yoyo: true,
      delay: Math.random() * 3,
    });
    gsap.to(obj.rotation, {
      z: `+=${(Math.random() - 0.5) * Math.PI}`,
      duration: 5 + Math.random() * 4,
      ease: 'sine.inOut', repeat: -1, yoyo: true,
    });
  }
}

// ═══════════════════════════════════════════════════════════
//  发射器：在路径 t 处生成一朵花
//
//  每朵花的行为：
//  1. 在发射器当前位置生成（极小尺寸）
//  2. 绽放：scale 弹出到目标大小（2-3s, elastic）
//  3. 漂移：向路径垂直方向缓慢移动（3-5s, power1.out）
//     → 两侧都有花 → 铺满全屏
//  4. 自旋：Y轴旋转增加立体感
//
//  targetScale 随 t 增大 → 路径后段花朵更大（POLA效果）
// ═══════════════════════════════════════════════════════════
const emitterObjects = [];
let flowerTemplate   = null;
let leafEmitTemplate = null;

function spawnObjectAt(t, type) {
  const tpl = type === 'leaf' ? leafEmitTemplate : flowerTemplate;
  if (!tpl) return;

  const pathPt = emitterPath.getPoint(t);
  const tangent = emitterPath.getTangent(Math.min(t, 0.999));

  const perpX = -tangent.y;
  const perpY =  tangent.x;

  const obj = deepClone(tpl);
  applyColor(obj, type === 'leaf' ? 'leaf' : 'flower');

  const jit = 12;
  obj.position.set(
    pathPt.x + (Math.random() - 0.5) * jit,
    pathPt.y + (Math.random() - 0.5) * jit,
    (Math.random() - 0.5) * 70,
  );

  const tilt = 32 * Math.PI / 180;
  obj.rotation.y = Math.random() * Math.PI * 2;
  obj.rotation.x = (Math.random() - 0.5) * tilt;
  obj.rotation.z = (Math.random() - 0.5) * tilt;

  // 花苞初始闭合（morph target）
  if (type !== 'leaf') {
    obj.traverse(n => {
      if (n.isMesh && n.morphTargetInfluences?.length)
        n.morphTargetInfluences[0] = 1;
    });
  }

  // t=0 → scale≈25, t=1 → scale≈115；叶子稍小
  const scaleMul   = type === 'leaf' ? 0.65 : 1.0;
  const targetScale = (25 + Math.pow(t, 0.55) * 90) * scaleMul;
  obj.scale.setScalar(0.5);
  scene.add(obj);
  emitterObjects.push(obj);

  // 绽放放大
  gsap.to(obj.scale, {
    x: targetScale, y: targetScale, z: targetScale,
    duration: 1.8 + Math.random() * 1.8,
    ease: type === 'leaf' ? 'back.out(1.2)' : 'elastic.out(1, 0.5)',
  });

  // 花苞展开（仅花朵）
  if (type !== 'leaf') {
    obj.traverse(n => {
      if (n.isMesh && n.morphTargetInfluences?.length) {
        gsap.to(n.morphTargetInfluences, { 0: 0, duration: 1.3, ease: 'power2.out' });
      }
    });
  }

  // 自旋
  const spinDir = Math.random() > 0.5 ? 1 : -1;
  const spinAxis = type === 'leaf' ? 'z' : 'y';
  gsap.to(obj.rotation, {
    [spinAxis]: `+=${spinDir * Math.PI * (1.5 + Math.random() * 2)}`,
    duration: 5 + Math.random() * 3,
    ease: 'power2.out',
  });

  // 向路径两侧漂移
  const side      = Math.random() > 0.5 ? 1 : -1;
  const baseDrift = 80 + Math.random() * 520;   // 80–600 世界单位
  const driftDur  = 3.5 + Math.random() * 3.5;

  gsap.to(obj.position, {
    x: `+=${perpX * side * baseDrift}`,
    y: `+=${perpY * side * baseDrift}`,
    duration: driftDur,
    ease: 'power1.out',
    delay: 0.05 + Math.random() * 0.4,
  });
}

// ═══════════════════════════════════════════════════════════
//  发射器状态（用 performance.now 计时，不受标签页切换影响）
// ═══════════════════════════════════════════════════════════
let emitterActive    = false;
let emitterStartWall = null;
let lastSpawnWall    = 0;

// ═══════════════════════════════════════════════════════════
//  主渲染循环
// ═══════════════════════════════════════════════════════════
(function loop() {
  requestAnimationFrame(loop);

  if (emitterActive && emitterStartWall !== null) {
    const now = performance.now();
    const elapsed = now - emitterStartWall;
    const t = Math.min(elapsed / EMITTER_DURATION, 1.0);

    // 按 wall-clock 间隔生成花朵（不受 GSAP 暂停影响）
    if (t < 1 && now - lastSpawnWall >= SPAWN_INTERVAL) {
      for (let i = 0; i < FLOWERS_PER_SPAWN; i++) {
        const type = Math.random() < LEAF_RATIO ? 'leaf' : 'flower';
        spawnObjectAt(t + i * 0.003, type);
      }
      lastSpawnWall = now;
    }
    if (t >= 1) emitterActive = false;
  }

  renderer.render(scene, camera);
})();

// ═══════════════════════════════════════════════════════════
//  模型加载
// ═══════════════════════════════════════════════════════════
const loader = new GLTFLoader();

function loadGLTF(url) {
  return new Promise((resolve, reject) => loader.load(url, g => resolve(g), undefined, reject));
}

function extractTemplate(gltfScene) {
  const children = gltfScene.children.filter(c => {
    let has = false; c.traverse(n => { if (n.isMesh) has = true; }); return has;
  });
  const tpl = children.length > 1 ? deepClone(children[0]) : gltfScene;
  convertToFlat(tpl);
  return tpl;
}

const progressEl = document.getElementById('progress-fill');
const overlayEl  = document.getElementById('overlay');
let loadedCount  = 0;

Promise.all([
  loadGLTF('./flower.glb'),
  loadGLTF('./leaf.glb'),
  loadGLTF('./confetti.glb'),
]).then(([flowerGltf, leafGltf, cfGltf]) => {
  progressEl.style.width = '100%';

  flowerTemplate   = extractTemplate(flowerGltf.scene);
  leafEmitTemplate = extractTemplate(leafGltf.scene);
  const cfTpl      = extractTemplate(cfGltf.scene);

  spawnBackground({ leaf: leafEmitTemplate, confetti: cfTpl });

  overlayEl.classList.add('fade-out');
  setTimeout(() => { overlayEl.style.display = 'none'; }, 700);
  bindUI();
}).catch(() => {
  document.getElementById('overlay-title').textContent = '❌ 模型加载失败';
});

// ═══════════════════════════════════════════════════════════
//  过场逻辑
//  覆层（白屏 / setup）使用 CSS transition + setTimeout
//  不走 GSAP，与标签页可见性无关
// ═══════════════════════════════════════════════════════════
const postgameEl = document.getElementById('postgame');
const coverEl    = document.getElementById('cover');
const coverMsgEl = document.getElementById('cover-msg');
const setupEl    = document.getElementById('setup');
const hintEl     = document.getElementById('demo-hint');

let transitioning = false;
let timers = [];

function startTransition() {
  if (transitioning) return;
  transitioning = true;

  // 结果页淡出
  gsap.to(postgameEl, { opacity: 0, duration: 0.45, onComplete: () => { postgameEl.style.pointerEvents = 'none'; } });
  hintEl.style.opacity = '0';

  // ── 启动发射器 ──
  emitterStartWall = performance.now();
  emitterActive    = true;
  lastSpawnWall    = 0;

  // ── 白屏 + 揭幕（全部用 setTimeout + CSS transition）──
  timers.push(setTimeout(() => {
    coverEl.style.transition = `opacity ${COVER_IN_MS / 1000}s ease-in`;
    coverEl.style.opacity    = '1';
    coverEl.style.pointerEvents = '';
  }, COVER_DELAY));

  timers.push(setTimeout(() => {
    coverMsgEl.style.opacity = '1';
  }, COVER_DELAY + COVER_IN_MS * 0.55));

  timers.push(setTimeout(() => {
    setupEl.style.opacity       = '1';
    setupEl.style.pointerEvents = '';
    coverMsgEl.style.opacity    = '0';
    timers.push(setTimeout(() => {
      coverEl.style.transition    = `opacity ${COVER_OUT_MS / 1000}s ease-in-out`;
      coverEl.style.opacity       = '0';
      timers.push(setTimeout(() => { coverEl.style.pointerEvents = 'none'; }, COVER_OUT_MS + 100));
    }, 300));
  }, REVEAL_DELAY));
}

// ═══════════════════════════════════════════════════════════
//  重置 Demo
// ═══════════════════════════════════════════════════════════
function resetDemo() {
  timers.forEach(id => clearTimeout(id));
  timers = [];
  transitioning = false;
  emitterActive = false;

  // 白色覆盖 → 重置 → 揭幕
  coverEl.style.transition    = 'opacity 0.4s ease-in';
  coverEl.style.opacity       = '1';
  coverEl.style.pointerEvents = '';

  setTimeout(() => {
    // 清除已生成的花朵
    emitterObjects.forEach(obj => {
      gsap.killTweensOf(obj.scale);
      gsap.killTweensOf(obj.position);
      gsap.killTweensOf(obj.rotation);
      obj.traverse(n => {
        if (n.isMesh && n.morphTargetInfluences?.length) gsap.killTweensOf(n.morphTargetInfluences);
      });
      scene.remove(obj);
    });
    emitterObjects.length = 0;
    emitterStartWall = null;

    setupEl.style.opacity       = '0';
    setupEl.style.pointerEvents = 'none';
    postgameEl.style.opacity    = '1';
    postgameEl.style.pointerEvents = '';
    hintEl.style.opacity        = '1';

    setTimeout(() => {
      coverEl.style.transition    = 'opacity 0.7s ease-out';
      coverEl.style.opacity       = '0';
      setTimeout(() => { coverEl.style.pointerEvents = 'none'; }, 750);
    }, 120);
  }, 520);
}

// ═══════════════════════════════════════════════════════════
//  UI 绑定
// ═══════════════════════════════════════════════════════════
function bindUI() {
  document.getElementById('play-again-btn').addEventListener('click', startTransition);
  document.querySelectorAll('.setup-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.setup-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });
  document.getElementById('start-btn').addEventListener('click', resetDemo);
}

// 标签页重新可见时让 GSAP 继续（背景动画用）
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) gsap.globalTimeline.play();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

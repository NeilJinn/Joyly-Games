<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperspace Jump Demo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #03000d; cursor: pointer; }

    #bg {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 50% 60%, #1e0440 0%, #0c0120 50%, #03000d 100%);
    }

    .scene {
      position: fixed; inset: 0; z-index: 1;
      perspective: 700px;
      perspective-origin: 50% 50%;
    }
    .stage {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
    }
    .item {
      position: absolute; left: 50%; top: 50%;
      transform-origin: center center;
      will-change: transform, opacity;
      pointer-events: none;
    }

    /* 跳跃瞬间的蓝白闪光 */
    #flash {
      position: fixed; inset: 0; z-index: 50;
      opacity: 0; pointer-events: none;
      background: radial-gradient(ellipse 70% 70% at 50% 50%,
        rgba(220,240,255,1) 0%,
        rgba(120,180,255,0.85) 25%,
        rgba(40,100,220,0.5) 55%,
        transparent 100%);
    }

    #ui {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
      z-index: 100; text-align: center; pointer-events: none;
    }
    #hint {
      color: rgba(255,255,255,0.28);
      font-family: system-ui, sans-serif;
      font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
    }
    #phase-label {
      color: rgba(255,255,255,0.12);
      font-family: 'SF Mono', monospace;
      font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div id="bg"></div>
<div class="scene">
  <div class="stage" id="stage"></div>
</div>
<div id="flash"></div>
<div id="ui">
  <div id="hint">点击画面触发超空间跳跃</div>
  <div id="phase-label">Phase 1 · Flower Field</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════
const CFG = {
  count:    60,
  zStart:  -2500,
  zEnd:     600,
  durMin:   3.5,
  durMax:   6.5,
  spreadX:  1.6,
  spreadY:  1.4,
};

const HYPER = {
  kickDur:  0.26,   // s — stretch animation duration
  stretchX: 28,     // radial stretch factor
  squashY:  0.08,   // perpendicular compression
  durMin:   0.32,
  durMax:   0.80,
  zStart:  -720,
};

const COLORS_NORMAL = [
  '#ff6b9d','#ff85b3','#e879f9','#d946ef',
  '#a78bfa','#818cf8','#60a5fa','#38bdf8',
  '#fbbf24','#fb923c','#f472b6','#34d399','#2dd4bf',
];

// ═══════════════════════════════════════════════════════════
//  SVG: 花朵（阶段一）
// ═══════════════════════════════════════════════════════════
function flowerSVG(color, size) {
  const id = `f${Math.random().toString(36).slice(2, 8)}`;
  const petals = [0, 60, 120, 180, 240, 300].map((r, i) =>
    `<ellipse cx="0" cy="-11" rx="5" ry="12" fill="${color}" opacity="${i % 2 ? 0.88 : 0.92}" transform="rotate(${r})"/>`
  ).join('');
  return `<svg viewBox="-24 -24 48 48" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="${id}" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#${id})">${petals}</g>
    <circle cx="0" cy="0" r="5.5" fill="white" opacity="0.95" filter="url(#${id})"/>
    <circle cx="0" cy="0" r="2.5" fill="${color}"/>
  </svg>`;
}

// ═══════════════════════════════════════════════════════════
//  SVG: 光速线条（阶段二）
//  线条中心对齐，右端（→ 径向外侧）最亮
// ═══════════════════════════════════════════════════════════
function streakSVG(color, w, h) {
  const id = `s${Math.random().toString(36).slice(2, 8)}`;
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="${id}" x="-5%" y="-250%" width="110%" height="600%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="lg${id}" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"   stop-color="${color}" stop-opacity="0"/>
        <stop offset="30%"  stop-color="${color}" stop-opacity="0.7"/>
        <stop offset="68%"  stop-color="#e8f4ff"  stop-opacity="1"/>
        <stop offset="88%"  stop-color="white"    stop-opacity="1"/>
        <stop offset="100%" stop-color="${color}"  stop-opacity="0.15"/>
      </linearGradient>
    </defs>
    <rect x="0" y="${h * 0.18}" width="${w}" height="${h * 0.64}" rx="${h * 0.32}"
          fill="url(#lg${id})" filter="url(#${id})"/>
  </svg>`;
}

// ═══════════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════════
const stageEl  = document.getElementById('stage');
const flashEl  = document.getElementById('flash');
const hintEl   = document.getElementById('hint');
const labelEl  = document.getElementById('phase-label');
const bgEl     = document.getElementById('bg');

let isHyper = false;
const items = []; // [{ el, x, y }]

// ═══════════════════════════════════════════════════════════
//  阶段一：花朵普通飞入
// ═══════════════════════════════════════════════════════════
function launchNormal(item, delay) {
  const { el } = item;
  const vw = window.innerWidth, vh = window.innerHeight;
  const nearCenter = Math.random() < 0.35;
  const x = (Math.random() - 0.5) * vw * (nearCenter ? 0.5 : CFG.spreadX);
  const y = (Math.random() - 0.5) * vh * (nearCenter ? 0.5 : CFG.spreadY);
  item.x = x; item.y = y;

  const color = COLORS_NORMAL[Math.floor(Math.random() * COLORS_NORMAL.length)];
  const size  = 36 + Math.random() * 44;
  const rotZ  = Math.random() * 360;
  const dur   = CFG.durMin + Math.random() * (CFG.durMax - CFG.durMin);
  const startZ = CFG.zStart - Math.random() * 800;

  el.innerHTML = flowerSVG(color, size);
  el.style.marginLeft = `-${size / 2}px`;
  el.style.marginTop  = `-${size / 2}px`;

  gsap.set(el, {
    x, y, z: startZ, rotationZ: rotZ,
    rotationX: (Math.random() - 0.5) * 20,
    scaleX: 1, scaleY: 1, opacity: 0,
  });
  gsap.to(el, {
    z: CFG.zEnd,
    rotationZ: rotZ + (Math.random() - 0.5) * 120,
    duration: dur, delay, ease: 'power1.in',
    onComplete: () => isHyper ? launchHyper(item, 0) : launchNormal(item, 0),
  });
  gsap.to(el, { opacity: 0.85, duration: dur * 0.18, delay, ease: 'power2.out' });
  gsap.to(el, { opacity: 0, duration: dur * 0.22, delay: delay + dur * 0.78, ease: 'power2.in' });
}

// ═══════════════════════════════════════════════════════════
//  阶段二：光速线条飞入
//  元素在生成时已经是最终的线条形态，径向对齐
// ═══════════════════════════════════════════════════════════
function launchHyper(item, delay) {
  const { el } = item;
  const vw = window.innerWidth, vh = window.innerHeight;

  // 线条从画面中心向四周辐射 → 偏向中心分布效果更好
  const spread = Math.random() < 0.5 ? 0.42 : 1.35;
  const x = (Math.random() - 0.5) * vw * spread;
  const y = (Math.random() - 0.5) * vh * spread;
  item.x = x; item.y = y;

  const angle = Math.atan2(y, x) * 180 / Math.PI;
  const hue   = 195 + Math.random() * 65;           // 蓝白色系
  const color = `hsl(${hue}, 80%, ${68 + Math.random() * 28}%)`;
  const size  = 38 + Math.random() * 32;
  const w = size * 4.5, h = Math.max(size * 0.38, 7);
  const dur   = HYPER.durMin + Math.random() * (HYPER.durMax - HYPER.durMin);
  const startZ = HYPER.zStart - Math.random() * 500;

  el.innerHTML = streakSVG(color, w, h);
  el.style.marginLeft = `-${w / 2}px`;
  el.style.marginTop  = `-${h / 2}px`;

  gsap.set(el, {
    x, y, z: startZ,
    rotationZ: angle,   // 径向对齐：正 x 轴指向远离中心的方向
    rotationX: 0,
    scaleX: 1, scaleY: 1,
    opacity: 0,
  });
  gsap.to(el, {
    z: CFG.zEnd, duration: dur, delay, ease: 'power2.in',
    onComplete: () => launchHyper(item, 0),
  });
  gsap.to(el, { opacity: 1, duration: dur * 0.12, delay, ease: 'linear' });
  gsap.to(el, { opacity: 0, duration: dur * 0.28, delay: delay + dur * 0.72, ease: 'power3.in' });
}

// ═══════════════════════════════════════════════════════════
//  超空间跳跃触发：花朵 → 拉伸 → 冲出 → 光速模式
// ═══════════════════════════════════════════════════════════
function jump() {
  if (isHyper) return;
  isHyper = true;

  // ── 1. 所有花朵同时拉伸到径向光条 ──────────────────────
  items.forEach(item => {
    const { el } = item;
    const x = gsap.getProperty(el, 'x');
    const y = gsap.getProperty(el, 'y');

    // 元素在原点附近给一个随机角度，避免 atan2(0,0)
    const angle = (Math.abs(x) < 5 && Math.abs(y) < 5)
      ? Math.random() * 360
      : Math.atan2(y, x) * 180 / Math.PI;

    gsap.killTweensOf(el);

    gsap.to(el, {
      rotationZ: angle,
      scaleX: HYPER.stretchX,
      scaleY: HYPER.squashY,
      opacity: 1,
      duration: HYPER.kickDur,
      ease: 'power3.in',
      onComplete() {
        // ── 2. 拉伸完成 → 冲出屏幕 ──
        gsap.to(el, {
          z: CFG.zEnd * 2.5,
          opacity: 0,
          duration: 0.18,
          ease: 'power4.in',
          onComplete: () => launchHyper(item, Math.random() * 0.35),
        });
      },
    });
  });

  // ── 3. 蓝白闪光 ──────────────────────────────────────────
  gsap.to(flashEl, {
    opacity: 0.9, duration: 0.16, ease: 'power4.out',
    onComplete: () => gsap.to(flashEl, { opacity: 0, duration: 1.1, ease: 'power2.out' }),
  });

  // ── 4. 背景 & UI 消退 ──────────────────────────────────
  gsap.to(bgEl, { opacity: 0, duration: 0.45, ease: 'power2.out' });
  gsap.to('#ui', { opacity: 0, duration: 0.8 });

  labelEl.textContent = 'Hyperspace ·';
  hintEl.textContent  = '超空间跳跃中···';
}

// ═══════════════════════════════════════════════════════════
//  初始化
// ═══════════════════════════════════════════════════════════
for (let i = 0; i < CFG.count; i++) {
  const el = document.createElement('div');
  el.className = 'item';
  stageEl.appendChild(el);
  const item = { el, x: 0, y: 0 };
  items.push(item);
  launchNormal(item, (i / CFG.count) * 5.5);
}

// 5 秒后自动跳跃
gsap.delayedCall(5, jump);

// 点击提前触发
document.addEventListener('click', jump);

window.addEventListener('resize', () => {
  // CSS perspective 自动适应 — 无需手动更新
});
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shader Lines · 单次题目转场</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090909; color: #fff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .stage { position: relative; width: min(1100px, 92vw); height: min(680px, 80vh); overflow: hidden; border-radius: 12px; background: #070914; }
      .question { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; padding: 40px; text-align: center; opacity: 0; transform: translateY(12px); transition: opacity 680ms ease, transform 680ms ease; }
      .question.visible { opacity: 1; transform: translateY(0); }
      .eyebrow { margin-bottom: 16px; color: #9faeff; font-size: 13px; font-weight: 800; letter-spacing: .18em; }
      h1 { max-width: 900px; margin: 0; font-size: clamp(42px, 6.2vw, 82px); line-height: 1.08; letter-spacing: -.055em; }
      .sub { margin-top: 20px; color: rgba(255,255,255,.62); font-size: 18px; }
      .shader-overlay { position: absolute; inset: 0; z-index: 2; opacity: 1; transition: opacity 780ms ease-out; background: #000; }
      .shader-overlay.leaving { opacity: 0; pointer-events: none; }
      #shader-lines, #shader-lines canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
      .controls { position: fixed; bottom: 22px; display: flex; align-items: center; gap: 14px; color: rgba(255,255,255,.65); font-size: 12px; }
      button { border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 10px 16px; background: rgba(255,255,255,.08); color: #fff; font: inherit; cursor: pointer; }
      button:hover { background: rgba(255,255,255,.16); }
    </style>
  </head>
  <body>
    <main class="stage">
      <section id="question" class="question" aria-live="polite">
        <div>
          <p class="eyebrow">QUESTION 03 · SPACE</p>
          <h1>太阳系中最大的行星是？</h1>
          <p class="sub">选择你认为正确的答案</p>
        </div>
      </section>
      <div id="shader-overlay" class="shader-overlay"><div id="shader-lines"></div></div>
    </main>
    <div class="controls"><button id="replay" type="button">重播转场</button><span>原 Shader Lines · 单次播放 → 题目淡入</span></div>
    <script>
      const container = document.getElementById("shader-lines");
      const overlay = document.getElementById("shader-overlay");
      const question = document.getElementById("question");
      const replay = document.getElementById("replay");
      const script = document.createElement("script");
      script.src = "https://cdnjs.cloudflare.com/ajax/libs/three.js/89/three.min.js";
      script.onload = () => {
        const THREE = window.THREE;
        const camera = new THREE.Camera();
        camera.position.z = 1;
        const scene = new THREE.Scene();
        const geometry = new THREE.PlaneBufferGeometry(2, 2);
        const uniforms = { time: { type: "f", value: 1.0 }, resolution: { type: "v2", value: new THREE.Vector2() } };
        const vertexShader = `void main() { gl_Position = vec4( position, 1.0 ); }`;
        const fragmentShader = `
          #define TWO_PI 6.2831853072
          #define PI 3.14159265359
          precision highp float;
          uniform vec2 resolution;
          uniform float time;
          float random (in float x) { return fract(sin(x)*1e4); }
          float random (vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233)))*43758.5453123); }
          varying vec2 vUv;
          void main(void) {
            vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
            vec2 fMosaicScal = vec2(4.0, 2.0);
            vec2 vScreenSize = vec2(256,256);
            uv.x = floor(uv.x * vScreenSize.x / fMosaicScal.x) / (vScreenSize.x / fMosaicScal.x);
            uv.y = floor(uv.y * vScreenSize.y / fMosaicScal.y) / (vScreenSize.y / fMosaicScal.y);
            float t = time*0.06+random(uv.x)*0.4;
            float lineWidth = 0.0008;
            vec3 color = vec3(0.0);
            for(int j = 0; j < 3; j++){
              for(int i=0; i < 5; i++){
                color[j] += lineWidth*float(i*i) / abs(fract(t - 0.01*float(j)+float(i)*0.01)*1.0 - length(uv));
              }
            }
            gl_FragColor = vec4(color[2],color[1],color[0],1.0);
          }
        `;
        const material = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader });
        scene.add(new THREE.Mesh(geometry, material));
        const renderer = new THREE.WebGLRenderer();
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        const resize = () => {
          const rect = container.getBoundingClientRect();
          renderer.setSize(rect.width, rect.height);
          uniforms.resolution.value.x = renderer.domElement.width;
          uniforms.resolution.value.y = renderer.domElement.height;
        };
        resize();
        window.addEventListener("resize", resize, false);
        let frame = null;
        let startedAt = 0;
        const PLAY_MS = 2400;
        const EXIT_AT_MS = 1640;
        const REVEAL_AT_MS = 2220;
        function play() {
          cancelAnimationFrame(frame);
          uniforms.time.value = 1.0;
          overlay.classList.remove("leaving");
          question.classList.remove("visible");
          startedAt = performance.now();
          const animate = (now) => {
            const elapsed = now - startedAt;
            uniforms.time.value = 1.0 + elapsed * 0.003; // Exact original cadence: +0.05/frame at 60 fps.
            renderer.render(scene, camera);
            if (elapsed >= EXIT_AT_MS) overlay.classList.add("leaving");
            if (elapsed >= REVEAL_AT_MS) question.classList.add("visible");
            if (elapsed < PLAY_MS) frame = requestAnimationFrame(animate);
          };
          frame = requestAnimationFrame(animate);
        }
        replay.addEventListener("click", play);
        play();
      };
      document.head.appendChild(script);
    </script>
  </body>
</html>

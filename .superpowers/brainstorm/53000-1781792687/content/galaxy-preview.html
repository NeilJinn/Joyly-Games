<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaxy Preferences — High Fidelity Preview</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green: #78d45e;
  --cyan: #5eb8d4;
  --purple: #a855f7;
  --ink: #e8f0f8;
  --muted: #6b7f92;
}

body {
  background: #050810;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-height: 100vh;
  padding: 32px 16px 60px;
}

.page-label {
  font-size: 11px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: rgba(200,212,222,.35);
  margin-bottom: 20px; text-align: center;
}

/* ── Phone shell ── */
.phone {
  width: 340px;
  background: #06080f;
  border-radius: 36px;
  border: 1.5px solid rgba(255,255,255,.12);
  overflow: hidden;
  box-shadow:
    0 0 0 6px rgba(255,255,255,.025),
    0 32px 80px rgba(0,0,0,.85),
    inset 0 1px 0 rgba(255,255,255,.06);
  position: relative;
}

.topbar {
  height: 52px;
  background: rgba(5,8,16,.97);
  border-bottom: 1px solid rgba(255,255,255,.06);
  display: flex; align-items: center; padding: 0 18px; gap: 10px;
  position: relative; z-index: 10;
}
.topbar .logo {
  width: 26px; height: 26px; border-radius: 7px;
  background: var(--green); flex: none;
  box-shadow: 0 0 10px rgba(120,212,94,.5), 0 0 20px rgba(120,212,94,.2);
}
.topbar .app-name {
  font-size: 14px; font-weight: 800; color: var(--ink); flex: none;
}
.topbar .spacer { flex: 1; }
.topbar .count-chip {
  font-size: 11px; font-weight: 700;
  background: rgba(120,212,94,.12); color: var(--green);
  border: 1px solid rgba(120,212,94,.3);
  border-radius: 20px; padding: 3px 10px;
  transition: all .3s;
}

/* ── Galaxy scene ── */
.galaxy-scene {
  position: relative;
  height: 580px;
  background: radial-gradient(ellipse at 30% 20%, rgba(99,102,241,.12) 0%, transparent 60%),
              radial-gradient(ellipse at 75% 70%, rgba(120,212,94,.06) 0%, transparent 50%),
              radial-gradient(ellipse at 60% 40%, rgba(168,85,247,.07) 0%, transparent 55%),
              linear-gradient(180deg, #090e1d 0%, #050810 100%);
  overflow: hidden;
}

/* Starfield */
.starfield { position: absolute; inset: 0; pointer-events: none; }
.star {
  position: absolute; border-radius: 50%;
  background: #fff;
  animation: twinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
}
@keyframes twinkle {
  0%, 100% { opacity: var(--base-op, .4); transform: scale(1); }
  50% { opacity: var(--peak-op, .9); transform: scale(1.3); }
}

/* Nebula blobs */
.nebula {
  position: absolute; border-radius: 50%; filter: blur(60px); pointer-events: none;
  animation: drift var(--dur, 12s) ease-in-out infinite alternate var(--delay, 0s);
}
@keyframes drift {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(var(--tx, 10px), var(--ty, 8px)) scale(var(--ts, 1.05)); }
}

/* SVG constellation layer */
.constellation-svg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 2;
}
.constellation-line {
  stroke: rgba(120,212,94,.35);
  stroke-width: 1.2;
  stroke-dasharray: 5 6;
  stroke-linecap: round;
  fill: none;
  transition: stroke-dashoffset 0.6s ease;
  animation: dash-flow 8s linear infinite;
}
@keyframes dash-flow {
  to { stroke-dashoffset: -44; }
}

/* Planet nodes */
.planet-wrap {
  position: absolute; z-index: 5;
  transform: translate(-50%, -50%);
  cursor: pointer;
  transition: filter .3s;
}
.planet-wrap:hover .planet { transform: scale(1.1); }
.planet-wrap:hover .planet-ring { opacity: .6; }

.planet {
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 2px;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .3s;
  position: relative; z-index: 2;
  border: 1.5px solid transparent;
}
.planet::before {
  content: '';
  position: absolute; inset: -3px;
  border-radius: 50%;
  background: inherit;
  filter: blur(8px);
  opacity: .4;
  z-index: -1;
  transition: opacity .3s, filter .3s;
}

/* Ring around planet */
.planet-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid;
  opacity: 0;
  transition: opacity .3s, transform .3s;
  pointer-events: none;
  animation: pulse-ring 2.5s ease-out infinite;
}
@keyframes pulse-ring {
  0% { transform: translate(-50%,-50%) scale(1); opacity: .5; }
  100% { transform: translate(-50%,-50%) scale(1.55); opacity: 0; }
}
.planet-wrap.active .planet-ring { opacity: 0; }

.planet-emoji {
  font-size: 18px; line-height: 1;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,.5));
  pointer-events: none;
  user-select: none;
}
.planet-label {
  font-size: 9px; font-weight: 800; text-transform: uppercase;
  letter-spacing: .06em; color: rgba(255,255,255,.75);
  pointer-events: none; user-select: none;
}

.planet-wrap.active .planet {
  transform: scale(1.15);
  border-color: rgba(255,255,255,.3);
}
.planet-wrap.active .planet::before {
  opacity: .7;
  filter: blur(12px);
}

/* Orbit ring — decorative, only on active */
.orbit {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.1);
  pointer-events: none;
  opacity: 0;
  transition: opacity .4s;
  transform: translate(-50%,-50%);
  animation: spin 18s linear infinite;
}
@keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
.orbit::after {
  content: '';
  position: absolute;
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(255,255,255,.6);
  top: -2.5px; left: 50%; transform: translateX(-50%);
  box-shadow: 0 0 4px rgba(255,255,255,.4);
}
.planet-wrap.active .orbit { opacity: 1; }

/* ── Bottom UI ── */
.bottom-ui {
  padding: 14px 16px 20px;
  background: rgba(5,8,16,.9);
  border-top: 1px solid rgba(255,255,255,.06);
  backdrop-filter: blur(20px);
  position: relative; z-index: 10;
  display: flex; flex-direction: column; gap: 10px;
}

.selected-pills {
  display: flex; flex-wrap: wrap; gap: 6px; min-height: 24px;
  align-items: center;
}
.selected-pill {
  padding: 3px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; gap: 4px;
  animation: pop-in .2s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop-in {
  from { transform: scale(0); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.empty-hint {
  font-size: 11px; color: var(--muted);
  font-style: italic;
}

.lock-btn {
  height: 46px; border-radius: 12px; width: 100%;
  background: linear-gradient(135deg, #78d45e 0%, #4db848 100%);
  border: none; cursor: pointer;
  font-size: 14px; font-weight: 800; color: #060a0e;
  box-shadow: 0 6px 20px rgba(120,212,94,.3), 0 2px 6px rgba(0,0,0,.3);
  transition: opacity .2s, transform .15s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  letter-spacing: .02em;
}
.lock-btn:disabled { opacity: .4; cursor: default; transform: none !important; }
.lock-btn:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(120,212,94,.35); }
.lock-btn:not(:disabled):active { transform: translateY(0); }

/* ── instruction ── */
.instruction {
  margin-top: 20px;
  text-align: center;
  font-size: 12px;
  color: rgba(200,212,222,.35);
  line-height: 1.6;
}
</style>
</head>
<body>

<div class="page-label">高保真预览 · 可交互 · 点击星球选择</div>

<div class="phone">
  <div class="topbar">
    <div class="logo"></div>
    <span class="app-name">Joyly Games</span>
    <div class="spacer"></div>
    <div class="count-chip" id="count-chip">0 / 3 picked</div>
  </div>

  <div class="galaxy-scene" id="scene">

    <!-- Nebula blobs -->
    <div class="nebula" style="width:220px;height:220px;background:rgba(99,102,241,.14);top:-60px;left:-40px;--dur:14s;--tx:15px;--ty:10px;--ts:1.08;"></div>
    <div class="nebula" style="width:180px;height:180px;background:rgba(120,212,94,.07);bottom:40px;right:-30px;--dur:11s;--delay:-3s;--tx:-12px;--ty:-8px;--ts:1.06;"></div>
    <div class="nebula" style="width:140px;height:140px;background:rgba(168,85,247,.1);top:40%;left:55%;--dur:16s;--delay:-6s;--tx:8px;--ty:14px;"></div>

    <!-- Starfield -->
    <div class="starfield" id="starfield"></div>

    <!-- Constellation SVG -->
    <svg class="constellation-svg" id="constellation-svg" viewBox="0 0 340 580">
      <!-- lines drawn by JS -->
    </svg>

    <!-- Header inside scene -->
    <div style="position:absolute;top:16px;left:18px;right:18px;z-index:6;">
      <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:4px;">Your Universe</div>
      <div style="font-size:17px;font-weight:800;color:#fff;line-height:1.2;">Tap to light up your stars</div>
      <div style="font-size:11px;color:rgba(200,212,222,.45);margin-top:3px;">Pick up to 3 categories</div>
    </div>

    <!-- Planet nodes — positions set inline -->
  </div><!-- end galaxy-scene -->

  <div class="bottom-ui">
    <div class="selected-pills" id="selected-pills">
      <span class="empty-hint">No categories selected yet…</span>
    </div>
    <button class="lock-btn" id="lock-btn" disabled>
      <span>🚀</span>
      <span>Launch My Round</span>
    </button>
  </div>
</div>

<div class="instruction">
  这是最终美术效果的可交互预览。<br>
  点击星球选择 / 再次点击取消 · 选中后会发光并连成星座
</div>

<script>
// ── Planet data ──
const PLANETS = [
  { id:'science',  emoji:'🔬', label:'Science', color:'#5e82f4', glow:'rgba(94,130,244,.55)',  x: 80,  y: 170 },
  { id:'history',  emoji:'📜', label:'History', color:'#f4b04a', glow:'rgba(244,176,74,.55)',  x: 240, y: 130 },
  { id:'sports',   emoji:'⚽', label:'Sports',  color:'#e05eb4', glow:'rgba(224,94,180,.55)',  x: 60,  y: 300 },
  { id:'music',    emoji:'🎵', label:'Music',   color:'#5eb8d4', glow:'rgba(94,184,212,.55)',  x: 200, y: 280 },
  { id:'film',     emoji:'🎬', label:'Film',    color:'#a855f7', glow:'rgba(168,85,247,.55)',  x: 120, y: 420 },
  { id:'tech',     emoji:'💻', label:'Tech',    color:'#78d45e', glow:'rgba(120,212,94,.55)',  x: 270, y: 400 },
];

const MAX = 3;
const selected = new Set();

// ── Starfield ──
const sf = document.getElementById('starfield');
for (let i = 0; i < 80; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = Math.random() < 0.3 ? 2 : 1;
  const baseOp = (.2 + Math.random() * .5).toFixed(2);
  const peakOp = Math.min(1, +baseOp + .3 + Math.random() * .2).toFixed(2);
  s.style.cssText = `
    width:${sz}px;height:${sz}px;
    top:${Math.random()*100}%;left:${Math.random()*100}%;
    --base-op:${baseOp};--peak-op:${peakOp};
    --dur:${2.5+Math.random()*4}s;--delay:-${Math.random()*5}s;
    opacity:${baseOp};
  `;
  sf.appendChild(s);
}

// ── Build planets ──
const scene = document.getElementById('scene');
PLANETS.forEach(p => {
  const size = 64;
  const wrap = document.createElement('div');
  wrap.className = 'planet-wrap';
  wrap.id = 'planet-' + p.id;
  wrap.style.cssText = `left:${p.x}px;top:${p.y}px;`;
  wrap.innerHTML = `
    <div class="planet" style="
      width:${size}px;height:${size}px;
      background: radial-gradient(circle at 35% 30%, ${lighten(p.color,.3)} 0%, ${p.color} 45%, ${darken(p.color,.35)} 100%);
      box-shadow: 0 0 0 1px ${p.glow}, 0 0 20px ${p.glow}, 0 4px 16px rgba(0,0,0,.6);
    ">
      <div class="planet-emoji">${p.emoji}</div>
      <div class="planet-label">${p.label}</div>
    </div>
    <div class="planet-ring" style="
      width:${size+22}px;height:${size+22}px;
      left:50%;top:50%;
      border-color:${p.glow};
    "></div>
    <div class="orbit" style="
      width:${size+36}px;height:${size+36}px;
      left:50%;top:50%;
    "></div>
  `;
  wrap.addEventListener('click', () => togglePlanet(p));
  scene.appendChild(wrap);
});

function lighten(hex, amt) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${Math.min(255,r+amt*255|0),Math.min(255,g+amt*255|0),Math.min(255,b+amt*255|0)},1)`;
}
function darken(hex, amt) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${Math.max(0,r-amt*255|0),Math.max(0,g-amt*255|0),Math.max(0,b-amt*255|0)},1)`;
}

// ── Toggle ──
function togglePlanet(p) {
  const wrap = document.getElementById('planet-' + p.id);
  if (selected.has(p.id)) {
    selected.delete(p.id);
    wrap.classList.remove('active');
  } else {
    if (selected.size >= MAX) return;
    selected.add(p.id);
    wrap.classList.add('active');
    // pulse burst
    const burst = document.createElement('div');
    burst.style.cssText = `
      position:absolute;width:80px;height:80px;border-radius:50%;
      background:${p.glow};pointer-events:none;
      transform:translate(-50%,-50%) scale(.5);opacity:.7;
      transition:transform .4s ease-out, opacity .4s ease-out;
      left:50%;top:50%;z-index:4;
    `;
    wrap.appendChild(burst);
    requestAnimationFrame(() => {
      burst.style.transform = 'translate(-50%,-50%) scale(2)';
      burst.style.opacity = '0';
    });
    setTimeout(() => burst.remove(), 500);
  }
  updateUI();
}

// ── Update constellation + pills ──
function updateUI() {
  // pills
  const pillsEl = document.getElementById('selected-pills');
  if (selected.size === 0) {
    pillsEl.innerHTML = '<span class="empty-hint">No categories selected yet…</span>';
  } else {
    pillsEl.innerHTML = '';
    selected.forEach(id => {
      const p = PLANETS.find(x => x.id === id);
      const pill = document.createElement('div');
      pill.className = 'selected-pill';
      pill.style.cssText = `background:${p.glow.replace('.55','.15')};color:${p.color};border:1px solid ${p.glow.replace('.55','.4')};`;
      pill.innerHTML = `${p.emoji} ${p.label}`;
      pillsEl.appendChild(pill);
    });
  }

  // lock button
  const btn = document.getElementById('lock-btn');
  btn.disabled = selected.size === 0;

  // count chip
  const chip = document.getElementById('count-chip');
  chip.textContent = `${selected.size} / ${MAX} picked`;
  chip.style.background = selected.size > 0 ? 'rgba(120,212,94,.15)' : 'rgba(255,255,255,.06)';
  chip.style.color = selected.size > 0 ? '#78d45e' : '#6b7f92';
  chip.style.borderColor = selected.size > 0 ? 'rgba(120,212,94,.35)' : 'rgba(255,255,255,.1)';

  // constellation lines
  const svg = document.getElementById('constellation-svg');
  svg.innerHTML = '';
  const selArr = [...selected];
  for (let i = 0; i < selArr.length - 1; i++) {
    for (let j = i + 1; j < selArr.length; j++) {
      const a = PLANETS.find(x => x.id === selArr[i]);
      const b = PLANETS.find(x => x.id === selArr[j]);
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
      line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
      line.setAttribute('class','constellation-line');
      // tiny dots at each end
      const d1 = document.createElementNS('http://www.w3.org/2000/svg','circle');
      d1.setAttribute('cx',a.x);d1.setAttribute('cy',a.y);d1.setAttribute('r','3');
      d1.setAttribute('fill','rgba(120,212,94,.6)');
      const d2 = document.createElementNS('http://www.w3.org/2000/svg','circle');
      d2.setAttribute('cx',b.x);d2.setAttribute('cy',b.y);d2.setAttribute('r','3');
      d2.setAttribute('fill','rgba(120,212,94,.6)');
      svg.appendChild(line);
      svg.appendChild(d1);
      svg.appendChild(d2);
    }
  }
}

updateUI();
</script>

</body>
</html>

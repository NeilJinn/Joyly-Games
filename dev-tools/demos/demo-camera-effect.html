<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Effect Demo — B: GSAP + CSS 3D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 60%, #1e0440 0%, #0c0120 50%, #03000d 100%);
    }

    /* ── 场景容器：这里设置透视距离（"焦距"）── */
    .scene {
      position: fixed;
      inset: 0;
      perspective: 700px;
      perspective-origin: 50% 50%;
    }

    /* ── 3D 舞台：保持子元素的 3D 变换 ── */
    .stage {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    /* ── 每个花/元素：锚点在视口中心 ── */
    .item {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: center center;
      will-change: transform, opacity;
      pointer-events: none;
    }

    /* ── 环境光晕（可选，纯 CSS） ── */
    .ambient {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(160, 80, 255, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* ── UI 标签 ── */
    .ui {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
      pointer-events: none;
    }
    .label {
      color: rgba(255, 255, 255, 0.25);
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .badge {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 6px 14px;
      color: rgba(255,255,255,0.4);
      font-family: system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<div class="scene">
  <div class="stage" id="stage"></div>
</div>
<div class="ambient"></div>

<div class="ui">
  <span class="label">Demo B · GSAP + CSS 3D Perspective</span>
  <span class="badge">← 可换成彩带 / 星星 / 任意元素</span>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  配置区 — 在这里换主题颜色 / 换元素类型
// ═══════════════════════════════════════════════════════════

const CONFIG = {
  count: 55,           // 元素总数
  perspective: 700,    // 与 CSS 保持一致（px）
  zStart: -2000,       // 出生 Z 距离（负 = 远离摄像机）
  zEnd: 500,           // 消失 Z 距离（正 = 超过摄像机）
  durationMin: 3.5,    // 最短飞行时间（秒）
  durationMax: 6.5,    // 最长飞行时间（秒）
  spreadX: 1.6,        // X 轴散布倍数（相对 vw）
  spreadY: 1.4,        // Y 轴散布倍数（相对 vh）
};

const COLORS = [
  // 粉紫系
  '#ff6b9d', '#ff85b3', '#e879f9', '#d946ef',
  // 蓝紫系
  '#a78bfa', '#818cf8', '#60a5fa', '#38bdf8',
  // 金橙系
  '#fbbf24', '#fb923c', '#f472b6',
  // 青绿系
  '#34d399', '#2dd4bf',
];

// ═══════════════════════════════════════════════════════════
//  元素生成函数 — 在这里替换成彩带、星星或其他图形
// ═══════════════════════════════════════════════════════════

function createFlowerSVG(color, size) {
  // 带发光滤镜的 6 瓣花
  const id = `glow-${Math.random().toString(36).slice(2, 7)}`;
  return `<svg viewBox="-24 -24 48 48" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="${id}" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#${id})">
      <ellipse cx="0" cy="-11" rx="5" ry="12" fill="${color}" opacity="0.92" transform="rotate(0)"/>
      <ellipse cx="0" cy="-11" rx="5" ry="12" fill="${color}" opacity="0.88" transform="rotate(60)"/>
      <ellipse cx="0" cy="-11" rx="5" ry="12" fill="${color}" opacity="0.92" transform="rotate(120)"/>
      <ellipse cx="0" cy="-11" rx="5" ry="12" fill="${color}" opacity="0.88" transform="rotate(180)"/>
      <ellipse cx="0" cy="-11" rx="5" ry="12" fill="${color}" opacity="0.92" transform="rotate(240)"/>
      <ellipse cx="0" cy="-11" rx="5" ry="12" fill="${color}" opacity="0.88" transform="rotate(300)"/>
    </g>
    <circle cx="0" cy="0" r="5.5" fill="white" opacity="0.95" filter="url(#${id})"/>
    <circle cx="0" cy="0" r="2.5" fill="${color}"/>
  </svg>`;
}

// ── 未来可替换的工厂：
// function createRibbonSVG(color, size) { ... }
// function createStarSVG(color, size) { ... }

// ═══════════════════════════════════════════════════════════
//  场景构建
// ═══════════════════════════════════════════════════════════

const stage = document.getElementById('stage');
const items = [];

for (let i = 0; i < CONFIG.count; i++) {
  const el = document.createElement('div');
  el.className = 'item';

  const color = COLORS[Math.floor(Math.random() * COLORS.length)];
  const size = 36 + Math.random() * 44;   // 36–80px（近大远小会由 3D 透视处理）

  el.innerHTML = createFlowerSVG(color, size);
  el.style.marginLeft = `-${size / 2}px`;
  el.style.marginTop = `-${size / 2}px`;

  stage.appendChild(el);
  items.push(el);
}

// ═══════════════════════════════════════════════════════════
//  动画核心
//
//  原理：
//  - 每个元素固定 X/Y（相对视口中心的偏移）
//  - Z 从 zStart（远）动画到 zEnd（近/超过摄像机）
//  - CSS perspective 自动把元素从"视野中心"往外推
//    → 产生"摄像机向前穿越花海"的视觉
// ═══════════════════════════════════════════════════════════

function launch(el, delay) {
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  // 随机 X/Y：混合"接近中心"和"边缘"两种分布
  let x, y;
  if (Math.random() < 0.35) {
    // 从靠近中心飞出（最有冲击感）
    x = (Math.random() - 0.5) * vw * 0.5;
    y = (Math.random() - 0.5) * vh * 0.5;
  } else {
    x = (Math.random() - 0.5) * vw * CONFIG.spreadX;
    y = (Math.random() - 0.5) * vh * CONFIG.spreadY;
  }

  const rotZ    = Math.random() * 360;
  const rotDelta = (Math.random() - 0.5) * 120;  // 飞行中的旋转量
  const duration = CONFIG.durationMin + Math.random() * (CONFIG.durationMax - CONFIG.durationMin);
  const startZ  = CONFIG.zStart - Math.random() * 800;

  gsap.set(el, {
    x, y,
    z: startZ,
    rotationZ: rotZ,
    rotationX: (Math.random() - 0.5) * 20,
    opacity: 0,
    scale: 1,
  });

  // ── Z 推进（摄像机向前感） ──
  gsap.to(el, {
    z: CONFIG.zEnd,
    rotationZ: rotZ + rotDelta,
    duration,
    delay,
    ease: 'power1.in',   // 先慢后快 → 加速冲来的感觉
    onComplete: () => launch(el, 0),
  });

  // ── 淡入（出生时渐显） ──
  gsap.to(el, {
    opacity: 0.85,
    duration: duration * 0.18,
    delay,
    ease: 'power2.out',
  });

  // ── 淡出（经过摄像机前消失） ──
  gsap.to(el, {
    opacity: 0,
    duration: duration * 0.22,
    delay: delay + duration * 0.78,
    ease: 'power2.in',
  });
}

// 错开出生时间，均匀铺满时间轴
items.forEach((el, i) => {
  const delay = (i / items.length) * 5.5;
  launch(el, delay);
});
</script>

</body>
</html>
